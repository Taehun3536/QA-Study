name: Java CI with MySQL and Playwright

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Node.js 24 관련 경고 해결을 위한 환경 변수
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jpa_lecture
          MYSQL_USER: iroha
          MYSQL_PASSWORD: iroha
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Playwright 브라우저 및 OS 필수 라이브러리 설치 (가장 중요)
      - name: Install Playwright Browsers and Deps
        run: npx playwright install --with-deps chromium

      # 2. 스프링 부트 서버를 백그라운드에서 실행
      - name: Start Spring Boot Server
        run: ./gradlew bootRun &
        env:
          DB_URL: jdbc:mysql://localhost:3306/jpa_lecture
          DB_USER: iroha
          DB_PW: iroha

      # 3. 서버가 완전히 뜰 때까지 대기 (Health Check)
      - name: Wait for Server to be Ready
        run: |
          npx wait-on http://localhost:8080 --timeout 60000

      # 4. 전체 테스트 실행 (API + UI E2E)
      - name: Run All Tests
        run: ./gradlew clean test e2eTest
        env:
          DB_URL: jdbc:mysql://localhost:3306/jpa_lecture
          DB_USER: iroha
          DB_PW: iroha